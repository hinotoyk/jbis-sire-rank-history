name: collect & deploy

# 每日北京时间 10:00（JST 11:00）晨间采集 → 构建 → 提交数据 → 发布 GitHub Pages
# 快照日期由 collect.js 的业务日期逻辑决定：JST 18:00 前采集归属前一个比赛日，
# 因此 GitHub 定时任务即使延迟数小时、跨过零点执行，日期标签也不会漂移到次日。
# 注意：GitHub 定时任务可能有 15 分钟～数小时的调度延迟；仓库 60 天无活动会被暂停（本仓库每日提交数据不会触发）

on:
  schedule:
    - cron: "0 2 * * *" # 10:00 北京时间 = 11:00 JST = 02:00 UTC
  workflow_dispatch: # 支持手动触发（Actions 页面 → Run workflow）

permissions:
  contents: write # 提交新快照
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect snapshots
        run: node src/collect.js
        continue-on-error: true # JBIS 偶发失败时仍用已有数据部署，不阻断当天发布

      - name: Build site
        run: node src/build-site.js

      - name: Commit new snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no new snapshots"
          else
            git commit -m "data: daily snapshot $(TZ=Asia/Tokyo date -d yesterday +%F) [skip ci]"
            git push
          fi

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
